name: streambox
description: A modern OTT streaming client built with Flutter.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management & dependency injection
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^4.0.0

  # Networking
  dio: ^5.11.0

  # Navigation
  go_router: ^17.5.0

  # Immutable models & serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  cached_network_image: ^3.4.1
  video_player: ^2.14.0
  # Local persistence.
  #
  # Held below drift 2.32: from there drift_dev requires analyzer 10+, while
  # custom_lint and riverpod_lint are still capped at analyzer 9. Static
  # analysis across the whole application is worth more than the two drift
  # minors, so drift is pinned until custom_lint catches up.
  drift: '>=2.30.0 <2.32.0'
  drift_flutter: ^0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  # End-to-end tests. Run on a device or emulator, not by `flutter test`.
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.7.1
  riverpod_generator: ^4.0.0
  freezed: ^3.0.0
  json_serializable: ^6.11.2
  go_router_builder: ^4.0.0

  # Riverpod-specific static analysis
  custom_lint: ^0.8.0
  riverpod_lint: ^3.0.0
  drift_dev: ">=2.30.0 <2.32.0"

flutter:
  uses-material-design: true

  fonts:
    # Inter, SIL Open Font License 1.1 (see assets/fonts/Inter-LICENSE.txt).
    # A single variable file: weights are applied through the `wght` axis by
    # AppTypography rather than shipping one binary per weight.
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
